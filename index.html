<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobXpay Knowledge Base | قاعدة المعرفة للموظفين</title>
<meta name="description" content="قاعدة المعرفة الداخلية لموظفي GlobXpay — الحسابات، الشحن والسحب، البطاقات، الرسوم، النماذج، وحل المشاكل.">
<meta name="robots" content="noindex">
<link rel="icon" href="logo3.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
/* يُطبَّق قبل رسم الصفحة لتفادي وميض الخلفية البيضاء في الوضع المظلم */
(function () {
    try {
        var saved = JSON.parse(localStorage.getItem('gxkb:theme') || 'null');
        var dark = saved ? saved === 'dark'
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* التخزين غير متاح */ }
})();
</script>
</head>
<body>

<a href="#view" class="skip-link" id="skipLink">تخطَّ إلى المحتوى</a>

<div class="layout">

    <!-- ============================ السايدبار ============================ -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="sidebar-head">
            <img src="logo3.jpeg" alt="GlobXpay">
            <div class="sidebar-brand">
                <b id="brandName">GlobXpay Knowledge Base</b>
                <span id="brandSub">قاعدة المعرفة للموظفين</span>
            </div>
        </div>

        <nav class="sidebar-nav" id="sidebarNav"></nav>

        <div class="sidebar-foot">
            <button class="collapse-btn" id="collapseBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
                </svg>
                <span id="collapseLabel">طيّ القائمة</span>
            </button>
        </div>
    </aside>

    <!-- ========================== المنطقة الرئيسية ========================== -->
    <div class="main-area">

        <header class="topbar">
            <button class="icon-btn menu-btn" id="menuBtn" aria-expanded="false" aria-controls="sidebar" aria-label="فتح القائمة">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
                </svg>
            </button>

            <span class="topbar-title" id="topbarTitle"></span>

            <div class="topbar-search search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/>
                </svg>
                <input type="search" id="q" autocomplete="off" placeholder="ابحث..." aria-label="البحث">
                <button class="search-clear" id="qClear" aria-label="مسح البحث">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <button class="icon-btn theme-btn" id="themeBtn" aria-label="الوضع الليلي" title="الوضع الليلي">
                <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke-linejoin="round"/>
                </svg>
                <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
                </svg>
            </button>

            <button class="lang-btn" id="langBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18a15 15 0 010-18z"/>
                </svg>
                <span id="langLabel">English</span>
            </button>
        </header>

        <main id="view"></main>

        <footer class="footer">
            <div class="footer-inner">
                <span>© 2024 GlobXpay — <span id="footCo">Advanced Technology for Financial Services Co.</span></span>
                <span class="badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 3l7 3v6c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6l7-3z" stroke-linejoin="round"/>
                        <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span id="footLicense">مرخصة من البنك المركزي الأردني</span>
                </span>
            </div>
        </footer>
    </div>
</div>

<div class="overlay" id="overlay"></div>

<!-- معاينة الصورة -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="lightbox-x" id="lightboxClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:19px;height:19px">
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>
        </svg>
    </button>
    <img id="lightboxImg" src="" alt="">
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="data/i18n.js"></script>
<script src="data/knowledge-base.js"></script>
<script src="data/knowledge-base.en.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
